[package]
name = "quotecraft-web"
description = "QuoteCraft in the browser (wasm32; build with `trunk build --release` in this directory). Talks to `quotecraft-cli serve`."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
quotecraft-ui-egui = { workspace = true }
quotecraft-remote = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "persistence", "accesskit"] }
egui = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "UrlSearchParams", "Navigator"] }
